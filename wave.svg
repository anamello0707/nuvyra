<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" preserveAspectRatio="none">
  <!-- Nuvyra's soft wave: silky lavender and peach ribbons rising to the right (used behind the start page and the welcome screen). -->
  <defs>
    <linearGradient id="back" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".45" stop-color="#A78BFA" stop-opacity=".35"/>
      <stop offset=".8" stop-color="#8B8CF6" stop-opacity=".45"/><stop offset="1" stop-color="#FBC9A7" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="1" x2="1" y2=".2">
      <stop offset="0" stop-color="#FBC9A7" stop-opacity="0"/><stop offset=".4" stop-color="#FBC9A7" stop-opacity=".45"/>
      <stop offset=".7" stop-color="#C4B5FD" stop-opacity=".55"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".6" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <path d="M0 232 C140 226 220 160 330 150 S500 160 640 60 V240 H0 Z" fill="url(#back)" filter="url(#soft)"/>
  <path d="M0 240 C170 232 260 185 380 180 S560 170 640 110 V240 H0 Z" fill="url(#front)"/>
  <path d="M60 236 C190 228 260 186 380 180 S560 170 640 110" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
</svg>
